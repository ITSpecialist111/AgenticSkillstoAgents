[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-chassis"
# Major version tracks the manifest apiVersion (skills.dev/v1).
version = "1.0.0"
description = "Skill Registry & Graduation service - the executable chassis that turns individual Skills into governed, org-wide capabilities."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AgenticSkillstoAgents" }]
keywords = ["skills", "agents", "mcp", "ontology", "registry", "governance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "jsonschema>=4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The HTTP service surface (chassis serve / chassis.api).
api = [
    "fastapi>=0.110",
    "uvicorn>=0.23",
]
# Everything needed to lint, type-check and test the package.
dev = [
    "pytest>=7.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.23",
    "ruff>=0.5",
]

[project.scripts]
chassis = "chassis.cli:main"

[project.urls]
Homepage = "https://github.com/ITSpecialist111/AgenticSkillstoAgents"
Repository = "https://github.com/ITSpecialist111/AgenticSkillstoAgents"

[tool.setuptools.packages.find]
include = ["chassis*"]

[tool.setuptools.package-data]
# Ship the canonical manifest schema inside the wheel so validation works when
# the package is installed away from the source tree (import-clean).
chassis = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Keep the prototype lint-clean but pragmatic: pyflakes + a subset of pycodestyle.
select = ["E", "F", "W", "I"]
ignore = ["E501"]
