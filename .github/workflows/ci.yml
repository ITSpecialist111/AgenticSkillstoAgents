name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: prototype

jobs:
  test:
    name: lint + type-check + tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package with dev extras
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check chassis tests

      - name: Run tests
        run: python -m pytest -q

  build:
    name: build wheel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distribution
        run: |
          pip install build
          python -m build
      - name: Verify the schema is bundled in the wheel
        run: |
          python - <<'PY'
          import glob, zipfile
          whl = sorted(glob.glob('dist/*.whl'))[-1]
          names = zipfile.ZipFile(whl).namelist()
          assert 'chassis/data/skill-manifest.schema.json' in names, names
          print('OK: schema bundled in', whl)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: agentic-chassis-wheel
          path: prototype/dist/*.whl
